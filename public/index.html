
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 28px;
      border-radius: 14px;
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      color: #cbd5e1;
      margin: 0;
    }

    .card {
      background: white;
      padding: 24px;
      margin-bottom: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0000000a;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      margin-top: 18px;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 12px;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      text-align: left;
      padding: 14px;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background: #f8fafc;
      color: #475569;
    }

    td:last-child, th:last-child {
      text-align: right;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px 10px;
      }

      .card, header {
        padding: 18px;
      }

      th, td {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>ProductHub</h1>
      <p>Product Management System</p>
    </header>

    <section class="card">
      <h2>Add New Product</h2>

      <form id="productForm">
        <label for="name">Product Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter product name"
          required
        >

        <label for="price">Price (₱)</label>
        <input
          type="number"
          id="price"
          name="price"
          placeholder="Enter product price"
          min="0"
          step="0.01"
          required
        >

        <button type="submit" id="submitButton">
          Add Product
        </button>

        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <h2>Product List</h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Product Name</th>
              <th>Price</th>
            </tr>
          </thead>
          <tbody id="productTable">
            <tr>
              <td colspan="3" id="load">Loading products...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
